<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام الجرد | نقل الجرد</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#070b14;
  --panel:#0d1422;
  --panel2:#111a2b;
  --line:#26334a;
  --text:#f8fafc;
  --muted:#8fa0b8;
  --blue:#3b82f6;
  --blue2:#2563eb;
  --orange:#f97316;
  --green:#10b981;
  --red:#ef4444;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 10%,#1d4ed833,transparent 30%),
    radial-gradient(circle at 85% 20%,#f9731620,transparent 28%),
    linear-gradient(135deg,#070b14,#0b1120 55%,#080d18);
  color:var(--text);
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

.bg-orb{
  position:fixed;
  border-radius:50%;
  filter:blur(80px);
  pointer-events:none;
  opacity:.25;
  z-index:0;
}

.orb1{
  width:260px;
  height:260px;
  background:#2563eb;
  top:-100px;
  right:-80px;
}

.orb2{
  width:220px;
  height:220px;
  background:#f97316;
  bottom:-100px;
  left:-70px;
}

.wrapper{
  width:min(1180px,calc(100% - 36px));
  margin:auto;
  padding:34px 0 28px;
  position:relative;
  z-index:1;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:38px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-icon{
  width:44px;
  height:44px;
  border:1px solid #ffffff18;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:#ffffff08;
  box-shadow:0 10px 30px #0004;
  font-size:22px;
}

.brand b{
  font-size:15px;
}

.brand span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.badge{
  padding:8px 12px;
  border:1px solid #ffffff12;
  border-radius:999px;
  color:#a9bad1;
  background:#ffffff06;
  font-size:12px;
}

/* =========================
   HERO
========================= */

.hero{
  text-align:center;
  max-width:850px;
  margin:0 auto 32px;
}

.hero .eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:#fdba74;
  background:#f9731616;
  border:1px solid #f9731633;
  border-radius:999px;
  padding:8px 13px;
  font-size:12px;
  font-weight:700;
  margin-bottom:18px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#fb923c;
  box-shadow:0 0 15px #f97316;
}

.hero h1{
  font-size:clamp(30px,5vw,48px);
  line-height:1.1;
  margin:0 0 14px;
  letter-spacing:-1.2px;
}

.hero h1 span{
  background:linear-gradient(90deg,#93c5fd,#fff,#fdba74);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:14px;
  line-height:1.9;
}

/* =========================
   MAIN GRID
========================= */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.box{
  position:relative;
  background:linear-gradient(145deg,#111a2beF,#0b1220E8);
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
  box-shadow:0 25px 70px #0006;
  overflow:hidden;
}

.box:before{
  content:"";
  position:absolute;
  inset:-1px;
  background:radial-gradient(
    circle at 90% 10%,
    #2563eb22,
    transparent 38%
  );
  pointer-events:none;
}

.box label{
  display:block;
  position:relative;
  z-index:1;
  font-size:13px;
  font-weight:700;
  margin-bottom:12px;
  color:#dbeafe;
}

/* =========================
   TEXTAREAS
========================= */

textarea{
  position:relative;
  z-index:1;
  width:100%;
  height:380px;
  background:#080f1c;
  border:1px solid #26334a;
  border-radius:14px;
  padding:15px;
  color:var(--text);
  font-family:'Courier New',Courier,monospace;
  font-size:.92rem;
  line-height:1.7;
  resize:none;
  outline:none;
  direction:ltr;
  text-align:left;
  transition:.2s ease;
}

textarea:focus{
  border-color:#3b82f6;
  box-shadow:0 0 0 3px #3b82f614;
}

textarea::placeholder{
  color:#64748b;
}

/* =========================
   AUTHOR / REPORT
========================= */

.full-width-box{
  margin-top:20px;
}

.full-width-box textarea{
  height:220px;
}

.input-author{
  position:relative;
  z-index:1;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:12px;
}

.input-author label{
  margin:0!important;
  min-width:145px;
  color:#cbd5e1!important;
}

.input-author input{
  background:#080f1c;
  border:1px solid #26334a;
  border-radius:11px;
  padding:11px 13px;
  color:var(--text);
  outline:none;
  font-size:.9rem;
  flex:1;
  transition:.2s ease;
}

.input-author input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px #3b82f614;
}

.input-author input::placeholder{
  color:#64748b;
}

/* =========================
   STATS
========================= */

.stats-bar{
  position:relative;
  z-index:1;
  margin-top:14px;
  background:#080f1c;
  border:1px solid #26334a;
  border-radius:12px;
  padding:12px 15px;
  font-size:.88rem;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.stats-count{
  color:#60a5fa;
  font-weight:bold;
}

.stats-duplicates{
  color:#f87171;
  font-weight:bold;
}

/* =========================
   BUTTONS
========================= */

.actions{
  display:flex;
  gap:10px;
  margin-top:22px;
  justify-content:center;
  flex-wrap:wrap;
}

button.action-btn{
  position:relative;
  border:1px solid transparent;
  padding:12px 20px;
  border-radius:11px;
  font-weight:700;
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  box-shadow:0 10px 30px #2563eb22;
  transition:.22s ease;
}

button.action-btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
  box-shadow:0 15px 35px #2563eb35;
}

button.secondary{
  background:#ffffff08;
  border:1px solid #334155;
  color:#cbd5e1;
  box-shadow:none;
}

button.secondary:hover{
  background:#ffffff10;
  border-color:#475569;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#0d1422;
  border:1px solid #10b98155;
  color:#d1fae5;
  padding:11px 20px;
  border-radius:11px;
  font-size:.88rem;
  opacity:0;
  box-shadow:0 15px 40px #0007;
  transition:all .3s ease;
  z-index:20;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

/* =========================
   FOOTER
========================= */

.footer{
  margin-top:28px;
  text-align:center;
  color:#64748b;
  font-size:11px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .wrapper{
    width:min(100% - 24px,650px);
    padding-top:20px;
  }

  .topbar{
    margin-bottom:32px;
  }

  .badge{
    display:none;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .box{
    border-radius:18px;
  }

  .input-author{
    flex-direction:column;
    align-items:stretch;
  }

  .input-author label{
    min-width:0;
  }

  textarea{
    height:330px;
  }

  .full-width-box textarea{
    height:220px;
  }
}
</style>
</head>

<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div class="wrapper">

  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">📦</div>
      <div>
        <b>نظام الجرد</b>
        <span>أداة نقل ومعالجة الجرد</span>
      </div>
    </div>

    <div class="badge">● النظام جاهز للعمل</div>
  </div>

  <header class="hero">
    <div class="eyebrow">
      <span class="dot"></span>
      معالجة الجرد النهائي
    </div>

    <h1>
      نقل <span>الجرد</span> إلى الروم النهائي
    </h1>

    <p>
      الصق استبيانات الجرد وسيتم تنظيمها ومعالجتها وإخراج النتيجة والتقرير الأسبوعي بشكل جاهز للنسخ.
    </p>
  </header>

  <div class="grid">

    <div class="box">
      <label>1. المدخلات — استبيانات الجرد</label>

      <textarea
        id="inputData"
        placeholder="الصق استبيانات الجرد هنا..."
      ></textarea>
    </div>

    <div class="box">
      <label>2. المخرجات — نتيجة الجرد المنسقة</label>

      <textarea
        id="outputData"
        placeholder="ستظهر النتيجة هنا..."
        readonly
      ></textarea>

      <div class="stats-bar">
        <div id="totalCount" class="stats-count">
          إجمالي العدد: 0
        </div>

        <div
          id="duplicateAlert"
          class="stats-duplicates"
          style="display:none;"
        ></div>
      </div>
    </div>

  </div>

  <div class="box full-width-box">

    <div class="input-author">
      <label>منشئ التقرير (اسمك/المنشن):</label>

      <input
        type="text"
        id="authorName"
        placeholder="أدخل اسمك..."
        oninput="processData()"
      >
    </div>

    <label>3. نموذج التقرير الأسبوعي — جاهز للنسخ</label>

    <textarea
      id="reportData"
      readonly
    ></textarea>

  </div>

  <div class="actions">

    <button
      class="action-btn"
      onclick="processData()"
    >
      ⚡ معالجة وتحديث
    </button>

    <button
      class="action-btn secondary"
      onclick="copyResult('outputData')"
    >
      📋 نسخ الجرد
    </button>

    <button
      class="action-btn secondary"
      onclick="copyResult('reportData')"
    >
      📄 نسخ التقرير الأسبوعي
    </button>

    <button
      class="action-btn secondary"
      onclick="clearAll()"
    >
      🗑️ مسح الكل
    </button>

  </div>

  <div class="footer">
    نظام الجرد • أداة نقل ومعالجة الجرد النهائي
  </div>

</div>

<div id="toast" class="toast">
  تم النسخ بنجاح!
</div>

<script>
const OUT_OF_SERVICE_ROLE_ID = "1480638365937434808";
const OUT_OF_SERVICE_ROLE_MENTION = `<@&${OUT_OF_SERVICE_ROLE_ID}>`;

function removeFancyFont(text) {
  if (!text) return '';
  let str = text.normalize('NFKD');
  let clean = '';
  for (let i = 0; i < str.length; i++) {
    let code = str.charCodeAt(i);
    if (code >= 0xD835) {
      let codePoint = str.codePointAt(i);
      if (codePoint >= 0x1D400 && codePoint <= 0x1D419) clean += String.fromCharCode(65 + (codePoint - 0x1D400));
      else if (codePoint >= 0x1D41A && codePoint <= 0x1D433) clean += String.fromCharCode(97 + (codePoint - 0x1D41A));
      else if (codePoint >= 0x1D434 && codePoint <= 0x1D44D) clean += String.fromCharCode(65 + (codePoint - 0x1D434));
      else if (codePoint >= 0x1D44E && codePoint <= 0x1D467) clean += String.fromCharCode(97 + (codePoint - 0x1D44E));
      else if (codePoint >= 0x1D468 && codePoint <= 0x1D481) clean += String.fromCharCode(65 + (codePoint - 0x1D468));
      else if (codePoint >= 0x1D482 && codePoint <= 0x1D49B) clean += String.fromCharCode(97 + (codePoint - 0x1D482));
      else if (codePoint >= 0x1D5D4 && codePoint <= 0x1D5ED) clean += String.fromCharCode(65 + (codePoint - 0x1D5D4));
      else if (codePoint >= 0x1D5EE && codePoint <= 0x1D607) clean += String.fromCharCode(97 + (codePoint - 0x1D5EE));
      else if (codePoint >= 0x1D608 && codePoint <= 0x1D621) clean += String.fromCharCode(65 + (codePoint - 0x1D608));
      else if (codePoint >= 0x1D622 && codePoint <= 0x1D63B) clean += String.fromCharCode(97 + (codePoint - 0x1D622));
      else if (codePoint >= 0x1D63C && codePoint <= 0x1D655) clean += String.fromCharCode(65 + (codePoint - 0x1D63C));
      else if (codePoint >= 0x1D656 && codePoint <= 0x1D66F) clean += String.fromCharCode(97 + (codePoint - 0x1D656));
      else {
        i++;
      }
    } else {
      clean += str[i];
    }
  }
  return clean.replace(/[\u0300-\u036f]/g, '').trim();
}

function cleanAndStandardizeRank(rawRank) {
  if (!rawRank) return '';
  let clean = removeFancyFont(rawRank);
  const standardRanks = [
    "Supervisor", "Mod", "Super Admin", "Head Admin", "Admin",
    "Controller", "Hand of the king", "Pre Master", "Master", "Advisor",
    "Operator", "Marshal", "Manager", "Director", "Executive",
    "President", "Commander", "Mythical", "Colonel", "Boss",
    "Big Boss", "CEO", "Co Founder", "Founder", "Consultant"
  ];
  const lowerClean = clean.toLowerCase();
  for (let rank of standardRanks) {
    if (lowerClean.includes(rank.toLowerCase())) return rank;
  }
  return clean;
}

function formatUserMention(rawInput) {
  if (!rawInput) return '';
  const digitMatch = rawInput.match(/\d{17,20}/);
  if (digitMatch) return `<@${digitMatch[0]}>`;
  let clean = rawInput.replace(/[\u200B-\u200D\uFEFF\u200F]/g, '').replace(/@+/g, '').trim();
  return `<@${clean}>`;
}

function processData() {
  const input = document.getElementById('inputData').value;
  const totalCountElem = document.getElementById('totalCount');
  const duplicateAlertElem = document.getElementById('duplicateAlert');
  const authorName = document.getElementById('authorName').value.trim();

  if (!input.trim()) {
    document.getElementById('outputData').value = '';
    document.getElementById('reportData').value = '';
    totalCountElem.textContent = 'إجمالي العدد: 0';
    duplicateAlertElem.style.display = 'none';
    return;
  }

  const lineSeparator = '`-----------------------------------------------------`';
  let result = `${lineSeparator}\n`;
  let processedCount = 0;
  let idTracker = {};

  let countNew = 0;
  let countOut = 0;
  let countBad = 0;
  let countActive = 0;

  const entries = input.split(/(?=منشن الشخص\s*:)/g);

  entries.forEach((entry) => {
    if (!entry.trim() || !entry.includes('منشن الشخص')) return;

    let data = { userMention: '', rank: '', finalEval: '' };
    const lines = entry.split(/\r?\n/);

    lines.forEach(line => {
      if (!line.includes(':')) return;
      const parts = line.split(':');
      const key = parts[0].trim();
      const val = parts.slice(1).join(':').trim();

      if (key === 'منشن الشخص') {
        data.userMention = val;
      } else if (key === 'الرتبة الادارية' || key === 'الرتبة  الادارية' || key.includes('الرتبة')) {
        data.rank = val;
      } else if (key === 'التقيم النهائي' || key === 'التقييم النهائي') {
        data.finalEval = val;
      }
    });

    if (data.userMention) {
      processedCount++;

      let rawKey = data.userMention.replace(/[^0-9]/g, '');
      if (rawKey && rawKey.length >= 17) idTracker[rawKey] = (idTracker[rawKey] || 0) + 1;

      const cleanRank = cleanAndStandardizeRank(data.rank);
      const evalText = (data.finalEval || '').trim();
      const matchedOutRoleMention = evalText.match(/<@&\d{17,20}>/);
      const hasOutByKeyword = evalText.includes('خارج خدمة') || evalText.includes('خارج الخدمة') || evalText.includes('إجازة');
      const hasOutByRoleMention = /<@&\d{17,20}>/.test(evalText);
      const hasOutByConfiguredRole = evalText.includes(OUT_OF_SERVICE_ROLE_ID) || evalText.includes(OUT_OF_SERVICE_ROLE_MENTION);
      const isOutOfService = hasOutByKeyword || hasOutByRoleMention || hasOutByConfiguredRole;
      let finalRating = data.finalEval || 'سيء';

      if (finalRating.includes('جديد')) {
        countNew++;
      } else if (isOutOfService) {
        countOut++;
        finalRating = matchedOutRoleMention ? matchedOutRoleMention[0] : OUT_OF_SERVICE_ROLE_MENTION;
      } else if (finalRating.includes('سيء') || finalRating.includes('سئ')) {
        countBad++;
      } else if (['جيد جدا', 'ممتاز', 'ممتاز جدا'].some(r => finalRating.includes(r))) {
        countActive++;
      }

      let formattedMention = formatUserMention(data.userMention);
      result += `${formattedMention}\nالتقييم : ${finalRating}\nالرتبة الادارية : ${cleanRank}\n${lineSeparator}\n`;
    }
  });

  document.getElementById('outputData').value = result;
  totalCountElem.textContent = `إجمالي العدد: ${processedCount}`;

  const weeklyReport = `** كم العدد حالي بالقسم: ${processedCount}\n\n` +
    `كم عدد ماخذين اجازة : ${countOut} ( ${countNew}جديد)\n\n` +
    `عدد غير متفاعلين : ${countBad}\n\n` +
    `عدد المتفاعلين بالقسم : ${countActive}\n` +
    `هل يوجد ملاحظة بالقسم او حاب تطور شي من جميع نواحي : لايوجد يعطيكم العافية   \n\n` +
    `تم انشاء التقرير من قبل : ( ${authorName} ) **`;

  document.getElementById('reportData').value = weeklyReport;

  let duplicates = Object.keys(idTracker).filter(key => idTracker[key] > 1);

  if (duplicates.length > 0) {
    duplicateAlertElem.style.display = 'block';
    duplicateAlertElem.innerHTML = `⚠️ تنبيه: يوجد IDs مكررة: <br>${duplicates.map(d => `- ${d} (تكرر ${idTracker[d]} مرات)`).join('<br>')}`;
  } else {
    duplicateAlertElem.style.display = 'none';
  }
}

function copyResult(elementId) {
  const output = document.getElementById(elementId);
  if (!output.value) return;
  output.select();
  navigator.clipboard.writeText(output.value);
  showToast();
}

function clearAll() {
  document.getElementById('inputData').value = '';
  document.getElementById('outputData').value = '';
  document.getElementById('reportData').value = '';
  document.getElementById('authorName').value = '';
  document.getElementById('totalCount').textContent = 'إجمالي العدد: 0';
  document.getElementById('duplicateAlert').style.display = 'none';
}

function showToast() {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

document.getElementById('inputData').addEventListener('input', processData);
</script>

</body>
</html>
