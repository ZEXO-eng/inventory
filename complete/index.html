<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مُكمل استبيانات جرد المسؤولين</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#050816;
  --panel:rgba(13,20,34,.72);
  --panel2:rgba(17,26,43,.62);
  --line:rgba(148,163,184,.16);
  --text:#f8fafc;
  --muted:#8fa0b8;
  --blue:#3b82f6;
  --blue2:#2563eb;
  --cyan:#06b6d4;
  --orange:#f97316;
  --green:#10b981;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 12% 8%,#2563eb35,transparent 30%),
    radial-gradient(circle at 88% 18%,#06b6d425,transparent 27%),
    radial-gradient(circle at 50% 100%,#6366f120,transparent 35%),
    linear-gradient(135deg,#050816,#0a1020 55%,#060b16);
  color:var(--text);
}

body{
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

body::before,
body::after{
  content:"";
  position:fixed;
  border-radius:50%;
  filter:blur(85px);
  pointer-events:none;
  opacity:.2;
  z-index:0;
}

body::before{
  width:300px;
  height:300px;
  background:#2563eb;
  top:-120px;
  right:-90px;
}

body::after{
  width:260px;
  height:260px;
  background:#06b6d4;
  bottom:-120px;
  left:-80px;
}

.wrap{
  width:min(1180px,calc(100% - 36px));
  margin:0 auto;
  padding:26px 0 24px;
  position:relative;
  z-index:1;
}

h1{
  margin:0 0 7px;
  font-size:clamp(30px,5vw,46px);
  letter-spacing:-1px;
}

.title-text{
  background:linear-gradient(90deg,#93c5fd,#fff,#67e8f9);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
}

.emoji{
  font-family:
    "Segoe UI Emoji",
    "Apple Color Emoji",
    "Noto Color Emoji",
    sans-serif;
  color:initial !important;
  -webkit-text-fill-color:initial !important;
  background:none !important;
  -webkit-background-clip:initial !important;
  background-clip:initial !important;
  display:inline-block;
}

.sub{
  color:var(--muted);
  margin-bottom:14px;
  font-size:13px;
  line-height:1.7;
}

.wrap > h1,
.wrap > .sub{
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.card{
  position:relative;
  background:
    linear-gradient(145deg,rgba(17,27,48,.82),rgba(8,15,29,.68));
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  box-shadow:
    0 25px 70px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.045);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  top:-90px;
  right:-70px;
  border-radius:50%;
  background:#2563eb18;
  filter:blur(35px);
  pointer-events:none;
}

.card label{
  display:block;
  font-weight:800;
  margin-bottom:8px;
  font-size:13px;
  color:#cbd5e1;
  position:relative;
  z-index:1;
}

textarea{
  width:100%;
  min-height:360px;
  resize:vertical;
  background:
    linear-gradient(145deg,rgba(3,9,22,.82),rgba(10,18,34,.72));
  color:#f8fafc;
  border:1px solid rgba(148,163,184,.15);
  border-radius:14px;
  padding:13px;
  line-height:1.8;
  font-family:Consolas,Tahoma,monospace;
  font-size:14px;
  direction:rtl;
  outline:none;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025),
    0 10px 30px rgba(0,0,0,.18);
  transition:.25s ease;
  position:relative;
  z-index:1;
}

textarea::placeholder{
  color:#64748b;
}

textarea:focus{
  border-color:rgba(59,130,246,.65);
  box-shadow:
    0 0 0 3px rgba(59,130,246,.09),
    0 15px 40px rgba(0,0,0,.25);
}

/* =========================
   خانات الأعضاء الجدد والخارجين
   ========================= */

.member-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:12px;
}

.member-options textarea{
  min-height:150px;
}

.buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:9px;
}

button{
  border:1px solid rgba(255,255,255,.08);
  border-radius:10px;
  padding:10px 15px;
  font-weight:700;
  cursor:pointer;
  color:white;
  transition:.22s ease;
  font-family:Tahoma,Arial,sans-serif;
}

button:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
}

button .emoji{
  font-family:
    "Segoe UI Emoji",
    "Apple Color Emoji",
    "Noto Color Emoji",
    sans-serif;
  color:initial !important;
  -webkit-text-fill-color:initial !important;
}

.paste{
  background:linear-gradient(135deg,#059669,#047857);
  box-shadow:0 10px 28px rgba(5,150,105,.18);
}

.clear{
  background:rgba(220,38,38,.82);
  box-shadow:0 10px 28px rgba(220,38,38,.13);
}

.copy{
  background:linear-gradient(135deg,#7c3aed,#6d28d9);
  box-shadow:0 10px 28px rgba(124,58,237,.18);
}

.main{
  background:linear-gradient(135deg,#f97316,#ea580c);
  font-size:15px;
  box-shadow:0 10px 30px rgba(249,115,22,.2);
}

.status{
  margin-top:8px;
  min-height:20px;
  color:#93c5fd;
  font-size:13px;
  line-height:1.7;
}

.result{
  min-height:400px;
  margin-top:12px;
}

.result textarea{
  min-height:400px;
}

.note{
  margin-top:11px;
  padding:10px 12px;
  border-radius:11px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(148,163,184,.11);
  font-size:12px;
  color:#94a3b8;
  line-height:1.9;
}

@media(max-width:850px){
  .grid,
  .member-options{
    grid-template-columns:1fr;
    gap:10px;
  }
}

@media(max-width:600px){
  .wrap{
    width:min(100% - 24px,620px);
    padding-top:20px;
  }

  h1{
    font-size:30px;
  }

  .card{
    padding:13px;
    border-radius:17px;
  }

  .buttons{
    flex-direction:column;
  }

  button{
    width:100%;
  }
}
</style>

</head>

<body>

<div class="wrap">

  <h1>
    <span class="emoji">📋</span>
    <span class="title-text">مُكمل استبيانات جرد المسؤولين</span>
  </h1>

  <div class="sub">
    يحسب ويملأ الحقول المطلوبة فقط، مع إبقاء بقية الاستبيان كما هو.
  </div>

  <!-- =========================
       الأعضاء الجدد / خارج الخدمة
       ========================= -->

  <div class="member-options">

    <div class="card">

      <label>الأعضاء الجدد</label>

      <textarea
        id="newMembers"
        placeholder="اكتب منشنات الأعضاء الجدد هنا...

مثال:
<@123456789>
<@987654321>"
      ></textarea>

      <div class="buttons">

        <button
          class="paste"
          onclick="pasteInto('newMembers','statusNew')"
        >
          <span class="emoji">📋</span>
          لصق المنشنات هنا
        </button>

        <button
          class="clear"
          onclick="clearOne('newMembers')"
        >
          مسح
        </button>

      </div>

      <div id="statusNew" class="status"></div>

    </div>


    <div class="card">

      <label>الأعضاء خارج الخدمة الإدراية</label>

      <textarea
        id="outOfService"
        placeholder="اكتب منشنات الأعضاء خارج الخدمة هنا...

مثال:
<@123456789>
<@987654321>"
      ></textarea>

      <div class="buttons">

        <button
          class="paste"
          onclick="pasteInto('outOfService','statusOut')"
        >
          <span class="emoji">📋</span>
          لصق المنشنات هنا
        </button>

        <button
          class="clear"
          onclick="clearOne('outOfService')"
        >
          مسح
        </button>

      </div>

      <div id="statusOut" class="status"></div>

    </div>

  </div>

  <div class="grid">

    <div class="card">

      <label>استبيان الجرد الأساسي</label>

      <textarea
        id="inventory"
        placeholder="الصق استبيان الجرد الأساسي هنا..."
      ></textarea>

      <div class="buttons">

        <button
          class="paste"
          onclick="pasteInto('inventory','status1')"
        >
          <span class="emoji">📋</span>
          لصق الاستبيان هنا
        </button>

        <button
          class="clear"
          onclick="clearOne('inventory')"
        >
          مسح
        </button>

      </div>

      <div id="status1" class="status"></div>

    </div>


    <div class="card">

      <label>استبيان تقييم المسؤوليات</label>

      <textarea
        id="responsibilities"
        placeholder="الصق استبيان تقييم المسؤوليات هنا..."
      ></textarea>

      <div class="buttons">

        <button
          class="paste"
          onclick="pasteInto('responsibilities','status2')"
        >
          <span class="emoji">📋</span>
          لصق تقييم المسؤوليات هنا
        </button>

        <button
          class="clear"
          onclick="clearOne('responsibilities')"
        >
          مسح
        </button>

      </div>

      <div id="status2" class="status"></div>

    </div>

  </div>


  <div class="card result">

    <label>النتيجة</label>

    <textarea
      id="output"
      readonly
      placeholder="ستظهر النتيجة هنا..."
    ></textarea>

    <div class="buttons">

      <button
        class="main"
        onclick="completeSurvey()"
      >
        <span class="emoji">✅</span>
        إكمال الاستبيان
      </button>

      <button
        class="copy"
        onclick="copyResult()"
      >
        <span class="emoji">📄</span>
        نسخ النتيجة
      </button>

      <button
        class="clear"
        onclick="clearAll()"
      >
        <span class="emoji">🗑️</span>
        مسح الكل
      </button>

    </div>

    <div id="status3" class="status"></div>

    <div class="note">
      البونص مستقل: إكمال 16 ساعة خلال الأسبوع = 50 نقطة إضافية، أو إكمال 400 صورة في
      <span class="emoji">📷</span>
      〡مراقبة・السيناريوهات = 50 نقطة إضافية. يمكن الحصول على البونصين معًا إذا تحقق الشرطان.
    </div>

  </div>

</div>

<script>

document.querySelectorAll('textarea').forEach(el=>{
  el.addEventListener('paste',()=>setTimeout(()=>{},0));
});


async function pasteInto(id,statusId){

  const box=document.getElementById(id);
  const status=document.getElementById(statusId);

  try{

    const text=await navigator.clipboard.readText();

    if(!text){
      status.textContent='⚠️ الحافظة فارغة.';
      return;
    }

    box.value=text;

    box.dispatchEvent(
      new Event('input',{bubbles:true})
    );

    status.textContent='✅ تم اللصق من الحافظة.';

  }catch(e){

    box.focus();

    status.textContent=
      '⚠️ المتصفح منع القراءة المباشرة للحافظة. اضغط Ctrl+V هنا للسماح باللصق.';
  }

}


function clearOne(id){
  document.getElementById(id).value='';
}


function clearAll(){

[
'inventory',
'responsibilities',
'output'
].forEach(
id=>
document.getElementById(id).value=''
);

[
'status1',
'status2',
'status3'
].forEach(
id=>
document.getElementById(id).textContent=''
);

}



async function copyResult(){

  const out=
    document.getElementById('output').value;

  if(!out)return;

  try{

    await navigator.clipboard.writeText(out);

    document.getElementById('status3').textContent=
      '✅ تم نسخ النتيجة.';

  }catch(e){

    document.getElementById('output').focus();

    document.execCommand('selectAll');
    document.execCommand('copy');

    document.getElementById('status3').textContent=
      '✅ تم نسخ النتيجة.';
  }

}


function num(s){

  const m=
    String(s??'')
      .replace(
        /[٠-٩]/g,
        d=>
          String(
            '٠١٢٣٤٥٦٧٨٩'.indexOf(d)
          )
      )
      .match(
        /-?\d+(?:[.,]\d+)?/
      );

  return m
    ? parseFloat(
        m[0].replace(',','.')
      )
    : 0;
}


function normalize(s){

  return String(s||'')
    .replace(
      /[٠-٩]/g,
      d=>
        String(
          '٠١٢٣٤٥٦٧٨٩'.indexOf(d)
        )
    )
    .replace(/ي/g,'ي')
    .trim();

}


function getLine(text,label){

  const lines=text.split(/\r?\n/);
  const target=normalize(label);

  for(const line of lines){

    const n=normalize(line);

    if(n.includes(target)){

      const p=line.indexOf(':');

      return p>=0
        ? line.slice(p+1).trim()
        : '';
    }

  }

  return '';
}


function replaceField(text,label,value){

  const re=
    new RegExp(
      '(^[ \\t]*'+
      label.replace(
        /[.*+?^${}()|[\]\\]/g,
        '\\$&'
      )+
      '[ \\t]*:)[^\\r\\n]*',
      'mi'
    );

  if(re.test(text))
    return text.replace(re,'$1 '+value);

  return text;
}


function replaceAny(text,labels,value){

  for(const label of labels){

    const before=text;

    text=
      replaceField(
        text,
        label,
        value
      );

    if(text!==before)
      return text;

  }

  return text;
}


function findTriple(text,label){

  const v=getLine(text,label);
  const a=v.match(/\d+/g);

  return a&&a.length>=3
    ? [+a[0],+a[1],+a[2]]
    : [0,0,0];

}


/* =========================
   استخراج ID العضو من المنشن
   ========================= */

function getMemberId(text){

  if(!text)
    return '';

  /*
    يدعم:
    <@123456789>
    <@!123456789>
  */

  const match=
    String(text).match(/<@!?(\d+)>/);

  return match
    ? match[1]
    : '';

}


/* =========================
   استخراج جميع IDs من الخانات
   ========================= */

function getMentionIds(text){

  if(!text)
    return [];

  const matches=
    String(text).match(/<@!?(\d+)>/g);

  if(!matches)
    return [];

  return matches.map(
    mention=>{

      const match=
        mention.match(/<@!?(\d+)>/);

      return match
        ? match[1]
        : '';

    }
  ).filter(Boolean);

}


/* =========================
   التحقق من حالة العضو
   ========================= */

function getSpecialFinalRating(text){

  const memberId=
    getMemberId(text);

  if(!memberId)
    return null;


  const newMembers=
    document
      .getElementById('newMembers')
      .value;


  const outOfService=
    document
      .getElementById('outOfService')
      .value;


  const newIds=
    getMentionIds(newMembers);


  const outIds=
    getMentionIds(outOfService);


  /*
    خارج الخدمة النهائية له الأولوية
  */

  if(
    outIds.includes(memberId)
  ){

    return '<@&1480638365937434808>';

  }


  /*
    إذا كان العضو جديد
  */

  if(
    newIds.includes(memberId)
  ){

    return 'جديد';

  }


  return null;

}


/* =========================
   نظام احتساب التقييم
   ========================= */

function rating(points){

  if(points<=150)
    return 'سيء';

  if(points<=250)
    return 'جيد جداً';

  if(points<=400)
    return 'ممتاز';

  if(points>=401)
    return 'ممتاز جداً';

  return 'غير محدد';
}


const rank={
  'سيء':0,
  'جيد جداً':1,
  'ممتاز':2,
  'ممتاز جداً':3
};


const rankName=[
  'سيء',
  'جيد جداً',
  'ممتاز',
  'ممتاز جداً'
];


/* =========================
   تقييم المسؤوليات
   مراقبة اللوقات مستثناة
   ========================= */

function responsibilityRating(text){

  const labels=[
    'مسؤول تدقيق الصور',
    'مسؤول الملاحظات',
    'مسؤول الاجازات',
    'مسؤول الإجازات',
    'مسؤول التحذيرات',
    'مسؤول دفتر الحضور'
  ];

  let vals=[];

  for(const l of labels){

    const v=
      normalize(getLine(text,l))
        .replace(/\s+/g,' ')
        .trim();

    if(
      !v ||
      v.includes('لا يوجد') ||
      v.includes('لايوجد')
    )
      continue;

    if(
      /ممتاز\s*جداً|ممتاز\s*جدا/.test(v)
    ){

      vals.push(3);

    }else if(
      /جيد\s*جداً|جيد\s*جدا/.test(v)
    ){

      vals.push(1);

    }else if(
      /ممتاز/.test(v)
    ){

      vals.push(2);

    }else if(
      /سيء|سيئ/.test(v)
    ){

      vals.push(0);

    }

  }

  if(!vals.length)
    return 'غير محدد';

  const highest=Math.max(...vals);

  const badCount=
    vals.filter(x=>x===0).length;

  return rankName[
    Math.max(
      0,
      highest-badCount
    )
  ];

}


/* =========================
   التقييم النهائي
   ========================= */

function finalRating(base,respons){

  if(
    !(base in rank) ||
    !(respons in rank)
  )
    return base;


  if(respons === 'سيء'){

    return rankName[
      Math.max(
        0,
        rank[base]-1
      )
    ];

  }


  return base;
}


/* =========================
   نقاط تفاعل المسؤوليات
   ========================= */

function responsibilityInteractionPoints(text){

  const bonuses=[

    {
      labels:[
        'مسؤول الاجازات',
        'مسؤول الإجازات'
      ],
      points:50
    },

    {
      labels:[
        'مسؤول مراقبة اللوقات'
      ],
      points:75
    },

    {
      labels:[
        'مسؤول الملاحظات'
      ],
      points:75
    },

    {
      labels:[
        'مسؤول تدقيق الصور'
      ],
      points:75
    },

    {
      labels:[
        'مسؤول دفتر الحضور'
      ],
      points:100
    }

  ];

  let total=0;

  for(const item of bonuses){

    let found=false;

    for(const label of item.labels){

      const value=
        normalize(
          getLine(text,label)
        )
        .replace(/\s+/g,' ')
        .trim();

      if(
        !value ||
        value.includes('لا يوجد') ||
        value.includes('لايوجد')
      )
        continue;

      if(
        /ممتاز\s*جداً|ممتاز\s*جدا/.test(value) ||
        /ممتاز/.test(value)
      ){

        found=true;
        break;

      }

    }

    if(found)
      total+=item.points;

  }

  return total;
}


/* =========================
   تحديد جرد الأعضاء
   ========================= */

function isMemberInventory(text){

  const n=
    normalize(text)
      .replace(/\s+/g,' ');

  return(
    /جرد\s*الاعضاء|جرد\s*الأعضاء/.test(n)
    ||
    /عدد\s*ساعات\s*مراقب\s*سرقات/.test(n)
  );

}


/* =========================
   ساعات جرد الأعضاء
   ========================= */

function getMemberRobberyHours(text){

  const value=
    getLine(
      text,
      'عدد ساعات مراقب سرقات'
    );

  const tm=
    value.match(
      /^\s*(\d+)\s*:\s*(\d{1,2})\s*$/
    );

  if(tm){

    return(
      parseInt(tm[1],10)
      +
      parseInt(tm[2],10)/60
    );

  }

  return num(value);
}


/* =========================
   الدالة الرئيسية
   ========================= */

function completeSurvey(){

  const inv=
    document
      .getElementById('inventory')
      .value;

  const resp=
    document
      .getElementById('responsibilities')
      .value;


  if(!inv.trim()){

    document
      .getElementById('status3')
      .textContent=
        '⚠️ أدخل استبيان الجرد الأساسي أولاً.';

    return;
  }


  const memberInventory=
    isMemberInventory(inv);


  /* =========================
     جرد الأعضاء
     ========================= */

  if(memberInventory){

    const rawHours=
      getMemberRobberyHours(inv);

    const hours=
      Math.round(rawHours);


    const jew=
      findTriple(
        inv,
        'عدد مراقبة المجوهرات + البنوك + اليخت'
      );


    const official=
      findTriple(
        inv,
        'عدد مراقبة سيناريوهات البنك المركزي + الميترو + الاستوديو'
      );


    const shops=
      findTriple(
        inv,
        'عدد مراقبة سرقة المنزل + بقالة + مصرف'
      );


    let scenario=

      official.reduce(
        (a,b)=>a+b,
        0
      )*6

      +

      jew.reduce(
        (a,b)=>a+b,
        0
      )*5

      +

      shops.reduce(
        (a,b)=>a+b,
        0
      )*3;


    const imgLine=

      getLine(
        inv,
        'هل أكمل مراقبة 400 صورة خلال الأسبوع؟'
      )

      ||

      getLine(
        inv,
        'هل أكمل مراقبة 300 صورة خلال الأسبوع؟'
      )

      ||

      getLine(
        inv,
        'مجموع الصور للسرقات'
      );


    const imgCount=
      num(imgLine);


    let bonus=0;


    if(
      imgCount>=400 ||
      /400/.test(imgLine)
    )
      bonus+=50;


    if(hours>=16)
      bonus+=50;


    const hourPoints=
      hours*30;


    const total=
      hourPoints+
      scenario+
      bonus;


    const base=
      rating(total);


    /*
      التقييم النهائي الخاص:
      عضو خارج الخدمة = الرتبة المطلوبة
      عضو جديد = جديد
      غير ذلك = التقييم الطبيعي
    */

    const specialFinal=
      getSpecialFinalRating(inv);

    const final=
      specialFinal!==null
        ? specialFinal
        : base;


    let out=inv;


    out=
      replaceAny(
        out,
        [
          'اجمالي نقاط السيناريوهات',
          'إجمالي نقاط السيناريوهات'
        ],
        scenario
      );


    out=
      replaceAny(
        out,
        [
          'مجموع البوينتات',
          'اجمالي البوينتات',
          'إجمالي البوينتات'
        ],
        total
      );


    out=
      replaceAny(
        out,
        ['التقييم'],
        base
      );


    out=
      replaceAny(
        out,
        [
          'التقيم النهائي',
          'التقييم النهائي'
        ],
        final
      );


    document
      .getElementById('output')
      .value=out;


    document
      .getElementById('status3')
      .textContent=
        '✅ تم إكمال جرد الأعضاء. الساعات: '+
        hours+
        ' ساعة = '+
        hourPoints+
        ' نقطة | نقاط السيناريوهات: '+
        scenario+
        ' نقطة | البونص: '+
        bonus+
        ' نقطة.';

    return;
  }


  /* =========================
     استخراج ساعات تسجيل الدخول
     ========================= */

  function getLoginHours(text){

    const directLabels=[

      'مجموع الساعات',

      'اجمالي ساعات تسجيل الدخول',

      'إجمالي ساعات تسجيل الدخول',

      'مجموع ساعات تسجيل الدخول',

      'عدد ساعات تسجيل الدخول',

      'ساعات تسجيل الدخول',

      'ساعات التسجيل',

      'اجمالي الساعات',

      'إجمالي الساعات'

    ];


    function parseHours(value){

      if(!value)
        return 0;


      value=normalize(value)
        .replace(/\s+/g,' ')
        .trim();


      let tm=value.match(
        /(\d+)\s*ساعة(?:\s*و)?\s*(\d+)\s*دقيقة/
      );


      if(tm){

        return(
          parseInt(tm[1],10)
          +
          parseInt(tm[2],10)/60
        );

      }


      tm=value.match(
        /^\s*(\d+)\s*:\s*(\d{1,2})\s*$/
      );


      if(tm){

        return(
          parseInt(tm[1],10)
          +
          parseInt(tm[2],10)/60
        );

      }


      tm=value.match(
        /(\d+)\s*ساعة/
      );


      if(tm)
        return parseInt(tm[1],10);


      if(/\d/.test(value))
        return num(value);


      return 0;
    }


    for(const label of directLabels){

      const value=
        getLine(
          text,
          label
        );


      if(value!==''){

        const hours=
          parseHours(value);

        if(hours>0)
          return hours;

      }

    }


    const lines=
      text.split(/\r?\n/);


    for(const line of lines){

      const n=
        normalize(line)
          .replace(/\s+/g,' ');


      if(
        /تسجيل\s*الدخول/.test(n) &&
        /ساع/.test(n) &&
        /\d/.test(n)
      ){

        const p=
          line.indexOf(':');


        const value=
          p>=0
            ? line.slice(p+1).trim()
            : line.trim();


        const hours=
          parseHours(value);


        if(hours>0)
          return hours;

      }

    }


    return(
      num(
        getLine(
          text,
          'ساعات مراقب سرقات'
        )
      )

      +

      num(
        getLine(
          text,
          'ساعات مراقب سيناريوهات'
        )
      )

      +

      num(
        getLine(
          text,
          'ساعات مراقب عام'
        )
      )
    );

  }


  const rawHours=
    getLoginHours(inv);


  const hours=
    Math.round(rawHours);


  /* =========================
     نقاط السيناريوهات
     ========================= */

  const shared=
    num(
      getLine(
        inv,
        'عدد مراقبة السيناريو المشترك'
      )
    );


  const jew=
    findTriple(
      inv,
      'عدد مراقبة المجوهرات + البنوك + اليخت'
    );


  const official=
    findTriple(
      inv,
      'عدد مراقبة سيناريوهات البنك المركزي + الميترو + الاستوديو'
    );


  const unsafe=

    num(
      getLine(
        inv,
        'السرقات بالمناطق غير الآمنة'
      )
    )

    ||

    num(
      getLine(
        inv,
        'عدد مراقبة السرقات بالمناطق غير الآمنة'
      )
    );


  const shops=
    findTriple(
      inv,
      'عدد مراقبة سرقة المنزل + بقالة + مصرف'
    );


  let scenario=

    shared*8

    +

    official.reduce(
      (a,b)=>a+b,
      0
    )*6

    +

    jew.reduce(
      (a,b)=>a+b,
      0
    )*5

    +

    unsafe*4

    +

    shops.reduce(
      (a,b)=>a+b,
      0
    )*3;


  /* =========================
     بونص 16 ساعة
     ========================= */

  let bonus=0;


  if(hours>=16)
    bonus+=50;


  /* =========================
     بونص 400 صورة
     ========================= */

  const imgLine=

    getLine(
      inv,
      'هل أكمل مراقبة 400 صورة خلال الأسبوع؟'
    )

    ||

    getLine(
      inv,
      'هل أكمل مراقبة 300 صورة خلال الأسبوع؟'
    );


  const imgCount=
    num(imgLine);


  if(
    imgCount>=400 ||
    /400/.test(imgLine)
  )
    bonus+=50;


  /* =========================
     نقاط المسؤوليات
     ========================= */

  const responsibilityPoints=
    responsibilityInteractionPoints(resp);


  const hourPoints=
    hours*30;


  const total=
    hourPoints+
    scenario+
    bonus+
    responsibilityPoints;


  const base=
    rating(total);


  const respRating=
    responsibilityRating(resp);


  const calculatedFinal=
    finalRating(
      base,
      respRating
    );


  /*
    التقييم الخاص للأعضاء:
    خارج الخدمة النهائية أو جديد
    يتغلب فقط على التقييم النهائي.
    جميع الحسبات السابقة تبقى كما هي.
  */

  const specialFinal=
    getSpecialFinalRating(inv);

  const final=
    specialFinal!==null
      ? specialFinal
      : calculatedFinal;


  /* =========================
     تعبئة النتيجة
     ========================= */

  let out=inv;


  out=
    replaceAny(
      out,
      [
        'اجمالي نقاط السيناريوهات',
        'إجمالي نقاط السيناريوهات'
      ],
      scenario
    );


  out=
    replaceAny(
      out,
      [
        'مجموع البوينتات',
        'اجمالي البوينتات',
        'إجمالي البوينتات'
      ],
      total
    );


  out=
    replaceAny(
      out,
      ['التقييم'],
      base
    );


  out=
    replaceAny(
      out,
      [
        'تقيم المسؤوليات',
        'تقييم المسؤوليات'
      ],
      respRating
    );


  out=
    replaceAny(
      out,
      [
        'التقيم النهائي',
        'التقييم النهائي'
      ],
      final
    );


  document
    .getElementById('output')
    .value=out;


  document
    .getElementById('status3')
    .textContent=

      '✅ تم إكمال الاستبيان. '+

      'الساعات: '+
      hours+
      ' ساعة = '+
      hourPoints+
      ' نقطة | '+

      'نقاط السيناريوهات: '+
      scenario+
      ' نقطة | '+

      'البونص: '+
      bonus+
      ' نقطة | '+

      'نقاط المسؤوليات: '+
      responsibilityPoints+
      ' نقطة | '+

      'إجمالي البوينتات: '+
      total+
      ' نقطة | '+

      'التقييم: '+
      base+
      ' | '+

      'تقييم المسؤوليات: '+
      respRating+
      ' | '+

      'التقييم النهائي: '+
      final+
      '.';

}

</script>
